name: Render listing banner
on:
  pull_request:
    paths:
      - .github/workflows/render-listing-banner.yml
      - listing-banner-source.svg
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin pngquant fonts-dejavu-core
          rsvg-convert -o rendered.png listing-banner-source.svg
          pngquant --speed 1 --force --output banner-1920x1080.png 64 rendered.png
          sha256sum banner-1920x1080.png
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          import base64
          image = Path('banner-1920x1080.png').read_bytes()
          assert image[:8] == b'\x89PNG\r\n\x1a\n'
          assert unpack('>II', image[16:24]) == (1920, 1080)
          assert len(image) < 80000
          for i in range(0, len(image), 3072):
              print('BANNER_BYTES ' + base64.b64encode(image[i:i + 3072]).decode())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: listing-banner
          path: banner-1920x1080.png
